services:
  kde-vm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops
    hostname: devops
    network_mode: "host"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./home_volume:/config
      - ./projects:/projects
    restart: unless-stopped
    privileged: true
