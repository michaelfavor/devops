services:
  kde-vm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops
    hostname: devops
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    ports:
      - "3389:3389"
      - "2222:22"
    volumes:
      - ./home_volume:/config
      - ./projects:/projects
    restart: unless-stopped
