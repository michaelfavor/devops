services:
  docker-desk:
    shm_size: 1gb
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-desk
    hostname: dock
    network_mode: "host"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./home_volume:/config
      - ./projects:/projects
      - ./docker-desk-doctor:/usr/local/share/docker-desk-doctor
    restart: unless-stopped
    privileged: true
