[supervisord]
nodaemon=true

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork
priority=10
autostart=true
autorestart=true

[program:sddm]
command=/usr/sbin/sddm
priority=20
autostart=true
autorestart=true

[program:xrdp-sesman]
command=/usr/sbin/xrdp-sesman
priority=25
autostart=true
autorestart=true

[program:xrdp]
command=/usr/sbin/xrdp -nodaemon
priority=30
autostart=true
autorestart=true

[program:sshd]
command=/usr/sbin/sshd -D
priority=40
autostart=true
autorestart=true
