[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB

[program:kde]
command=/bin/bash /startkde.sh
priority=30
autostart=true
autorestart=true
user=root
stdout_logfile=/tmp/kde.log
stderr_logfile=/tmp/kde.err
stopwaitseconds=60
redirect_stderr=true

[program:sshd]
command=/usr/sbin/sshd -D
priority=100
autostart=true
autorestart=true
user=root